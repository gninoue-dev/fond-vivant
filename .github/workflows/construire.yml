name: Construire

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  natif:
    name: fv-bureau (Linux + Windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev gcc-mingw-w64-x86-64
      - name: Compiler
        run: make -C natif linux windows CFLAGS="-O2 -Wall -Wextra -Werror"
      - uses: actions/upload-artifact@v4
        with:
          name: fv-bureau
          path: outils/

  windows:
    name: Application Windows
    needs: natif
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fv-bureau
          path: outils
      - name: Télécharger mpv et ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          nom=$(gh release view --repo shinchiro/mpv-winbuild-cmake --json assets \
                -q '.assets[].name | select(test("^mpv-x86_64-[0-9]"))' | head -1)
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "$nom" --dir telechargements
          7z x -otelechargements/mpv "telechargements/$nom"
          cp telechargements/mpv/mpv.exe outils/
          curl -sSL -o telechargements/ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x -otelechargements/ffmpeg telechargements/ffmpeg.zip
          cp telechargements/ffmpeg/*/bin/ffmpeg.exe telechargements/ffmpeg/*/bin/ffprobe.exe outils/
          ls -l outils
      - name: Empaqueter
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --windowed --name FondVivant lancer.py
          cp -r outils dist/FondVivant/outils
          cp README.md LICENSE dist/FondVivant/
          cd dist && 7z a ../FondVivant-windows.zip FondVivant
      - name: Vérifier que l'application démarre
        shell: bash
        run: |
          ./dist/FondVivant/outils/fv-bureau.exe --ecrans || true
          ./dist/FondVivant/outils/mpv.exe --version | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: FondVivant-windows
          path: FondVivant-windows.zip
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" FondVivant-windows.zip --title "Fond Vivant ${GITHUB_REF_NAME}" --generate-notes
